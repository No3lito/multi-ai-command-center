name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: command_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://cc:ci-only-password@127.0.0.1:5432/command_center_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy command_center
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: command_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://cc:ci-only-password@127.0.0.1:5432/command_center_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
