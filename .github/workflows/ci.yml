name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: command_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://cc:ci-only-password@127.0.0.1:5432/command_center_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      # The Docker image installs without dev tools: the app must import with only its own dependencies.
      - run: UV_PROJECT_ENVIRONMENT=/tmp/prod uv sync --frozen --no-dev && /tmp/prod/bin/python -c "import command_center.app"
      - run: uv sync --frozen
      # Every check runs even when an earlier one fails, so one push reports every problem.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
        if: ${{ !cancelled() }}
      - run: uv run mypy command_center
        if: ${{ !cancelled() }}
      - run: uv run pytest -q
        if: ${{ !cancelled() }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Every check runs even when an earlier one fails, so one push reports every problem.
      - run: npm run lint
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - id: build
        run: npm run build
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: web-out
          path: apps/web/out

  e2e:
    needs: [backend, web]
    # Browser tests run whenever the dashboard built, even if a lint or unit check failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: command_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://cc:ci-only-password@127.0.0.1:5432/command_center_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
