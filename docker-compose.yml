# Multi-AI Command Center: local stack.
# Usage: cp .env.example .env, set the passwords, then `docker compose up --build`.
# Everything is published on 127.0.0.1 only; nothing is reachable from your network.

name: command-center

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-command_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-command_center}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-command_center} -d ${POSTGRES_DB:-command_center}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the app container can reach the database.

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-command_center}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-command_center}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env (12+ characters)}
      OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-Owner}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AI providers (Milestone B). Keys stay in your local .env, which git ignores.
      PROVIDER_MODE: ${PROVIDER_MODE:-live}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LIVE_BUDGET_USD: ${LIVE_BUDGET_USD:-10.00}
      # MCP gateway for external agents (Grok Bot). Listens inside the container; published
      # on this computer's loopback only. Expose it to the internet only through a tunnel
      # pointed at port 8001, never the dashboard on 8000.
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      # The owner's workspace (FILES_FOLDER on this computer). The Command Center writes only to
      # each project's briefs, decisions, outputs and notes folders and the project table in
      # INDEX.md. Linked project sources are mounted read-only under /sources by
      # docker-compose.override.yml, written by infrastructure/workspace-mounts.ps1.
      FILES_ROOT: /shared
      SOURCES_ROOT: /sources
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ${FILES_FOLDER:-./shared-files}:/shared
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256

volumes:
  db-data:
